name: Swiftcamp
options:
  bundleIdPrefix: com.swiftcamp
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: "6.29.0"
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.11.0"

targets:
  Swiftcamp-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Swiftcamp
        excludes:
          - "Info.plist"
          - "Resources"
          - "*.entitlements"
      # Folder references, so these directories survive into the bundle
      # with their subpaths intact.
      #
      # Reference the *subdirectories*, never `Resources` itself. An iOS
      # .app containing a directory literally named `Resources` makes
      # CFBundle read it as an old-style macOS bundle and look for
      # Info.plist inside it — the app then installs with "Missing bundle
      # ID" and simctl refuses to launch it. tachbase-ios avoids this the
      # same way, by referencing Web/, Glyphs/, BundledTiles/ individually.
      - path: Swiftcamp/Resources/basemap
        type: folder
      - path: Swiftcamp/Resources/web
        type: folder
      - path: Swiftcamp/Resources/glyphs
        type: folder
      - path: Swiftcamp/Resources/sprites
        type: folder
      - path: Swiftcamp/Resources/routing
        type: folder
      # The app icon, made in Icon Composer. It lives outside Swiftcamp/,
      # so it has to be listed here or a regenerate drops it.
      - path: SwiftCamp.icon
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftcamp.app
        ASSETCATALOG_COMPILER_APPICON_NAME: SwiftCamp
        INFOPLIST_FILE: Swiftcamp/Info.plist
        PRODUCT_NAME: Swiftcamp
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.navigation
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: MapLibre
        product: MapLibre
      - package: GRDB
        product: GRDB

  Swiftcamp-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Swiftcamp
        excludes:
          - "Info.plist"
          - "Resources"
          - "*.entitlements"
      - path: Swiftcamp/Resources/basemap
        type: folder
      - path: Swiftcamp/Resources/web
        type: folder
      - path: Swiftcamp/Resources/glyphs
        type: folder
      - path: Swiftcamp/Resources/sprites
        type: folder
      # The Valhalla config template; see RoutingEngine.init(streaming:).
      - path: Swiftcamp/Resources/routing
        type: folder
      - path: SwiftCamp.icon
        buildPhase: resources
      # The licence and the third-party notices, which the app shows under
      # Help, Acknowledgements: they have to travel with the binary, not
      # only live in the repository.
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    # Without this, a missing Valhalla build surfaces as a missing header
    # deep in the C++ bridge, which does not say what to run.
    preBuildScripts:
      - name: Check Valhalla
        basedOnDependencyAnalysis: false
        script: |
          if [ ! -f "$SRCROOT/Vendor/valhalla/build/src/libvalhalla.a" ]; then
            echo "error: Valhalla is not built. Run scripts/build-valhalla.sh once, then build again."
            exit 1
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftcamp.app.mac
        # Apple Silicon only, like Valhalla and its libraries: an Intel Mac
        # runs BaseCamp natively for as long as its macOS does, and the
        # Macs losing BaseCamp are the ones losing Rosetta. Release builds
        # every architecture by default and failed to link for Intel.
        ARCHS: arm64
        ASSETCATALOG_COMPILER_APPICON_NAME: SwiftCamp
        PRODUCT_NAME: Swiftcamp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.navigation
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Matt Ackerman. Free software under the GNU GPL, version 3."
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        # Location for the locate button, which the hardened runtime
        # withholds without the entitlement; see Map/Locator.swift.
        CODE_SIGN_ENTITLEMENTS: Swiftcamp/Swiftcamp-macOS.entitlements
        INFOPLIST_KEY_NSLocationUsageDescription: "Swiftcamp centres the map on where you are when you click the location button."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Swiftcamp centres the map on where you are when you click the location button."
        # The C USB transport. Only macOS gets the bridging header: IOKit's
        # USB interfaces do not exist on iOS, where the same .c compiles to
        # stubs.
        SWIFT_OBJC_BRIDGING_HEADER: Swiftcamp/Device/Swiftcamp-Bridging-Header.h
        # Valhalla, the routing engine, linked statically from the CMake
        # build scripts/build-valhalla.sh makes in Vendor/valhalla, with
        # its libraries from scripts/build-deps.sh: see docs/routing.md.
        # Gitignored and fetched, like the basemap. The app carries all of
        # it inside; scripts/package-app.sh checks that it loads nothing
        # else.
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Swiftcamp/Device
          - $(SRCROOT)/Swiftcamp/Routing
          - $(SRCROOT)/Vendor/valhalla
          - $(SRCROOT)/Vendor/valhalla/build
          - $(SRCROOT)/Vendor/valhalla/build/src
          - $(SRCROOT)/Vendor/valhalla/third_party/rapidjson/include
          - $(SRCROOT)/Vendor/valhalla/third_party/date/include
          - $(SRCROOT)/Vendor/valhalla/third_party/unordered_dense/include
          # protobuf's and abseil's headers from the build that is linked,
          # ahead of Homebrew's; Homebrew is left for boost, which is
          # headers alone and leaves nothing in the binary.
          - $(SRCROOT)/Vendor/deps/include
          - /opt/homebrew/include
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/Vendor/valhalla/build/src
          - $(SRCROOT)/Vendor/valhalla/build/src/tyr
          - $(SRCROOT)/Vendor/valhalla/build/src/loki
          - $(SRCROOT)/Vendor/valhalla/build/src/thor
          - $(SRCROOT)/Vendor/valhalla/build/src/odin
          - $(SRCROOT)/Vendor/valhalla/build/src/sif
          - $(SRCROOT)/Vendor/valhalla/build/src/meili
          - $(SRCROOT)/Vendor/valhalla/build/src/skadi
          - $(SRCROOT)/Vendor/valhalla/build/src/baldr
          - $(SRCROOT)/Vendor/valhalla/build/src/midgard
          - $(SRCROOT)/Vendor/valhalla/build/src/valhalla/proto
          # Static protobuf, abseil and lz4 for macOS 14, from
          # scripts/build-deps.sh. Never /opt/homebrew/lib: its dylibs
          # were built for this Mac's macOS, and an app linked against
          # them runs on no other.
          - $(SRCROOT)/Vendor/deps/lib
        OTHER_LDFLAGS:
          - -lvalhalla
          - -lvalhalla-tyr
          - -lvalhalla-loki
          - -lvalhalla-thor
          - -lvalhalla-odin
          - -lvalhalla-sif
          - -lvalhalla-meili
          - -lvalhalla-skadi
          - -lvalhalla-baldr
          - -lvalhalla-midgard
          - -lvalhalla-proto
          - -lprotobuf
          # protobuf's own dependencies, from `pkg-config --libs protobuf`.
          - -labsl_base
          - -labsl_base_cpu_detect
          - -labsl_city
          - -labsl_civil_time
          - -labsl_cord
          - -labsl_cord_internal
          - -labsl_cordz_functions
          - -labsl_cordz_handle
          - -labsl_cordz_info
          - -labsl_crc_cord_state
          - -labsl_crc_internal
          - -labsl_crc32c
          - -labsl_debugging_internal
          - -labsl_decode_rust_punycode
          - -labsl_demangle_internal
          - -labsl_demangle_rust
          - -labsl_die_if_null
          - -labsl_examine_stack
          - -labsl_exponential_biased
          - -labsl_flags_commandlineflag
          - -labsl_flags_commandlineflag_internal
          - -labsl_flags_config
          - -labsl_flags_internal
          - -labsl_flags_marshalling
          - -labsl_flags_private_handle_accessor
          - -labsl_flags_program_name
          - -labsl_flags_reflection
          - -labsl_graphcycles_internal
          - -labsl_hardening
          - -labsl_hash
          - -labsl_hashtablez_sampler
          - -labsl_int128
          - -labsl_kernel_timeout_internal
          - -labsl_leak_check
          - -labsl_log_entry
          - -labsl_log_globals
          - -labsl_log_initialize
          - -labsl_log_internal_check_op
          - -labsl_log_internal_conditions
          - -labsl_log_internal_fnmatch
          - -labsl_log_internal_format
          - -labsl_log_internal_globals
          - -labsl_log_internal_log_sink_set
          - -labsl_log_internal_message
          - -labsl_log_internal_nullguard
          - -labsl_log_internal_proto
          - -labsl_log_internal_structured_proto
          - -labsl_log_severity
          - -labsl_log_sink
          - -labsl_malloc_internal
          - -labsl_random_distributions
          - -labsl_random_internal_entropy_pool
          - -labsl_random_internal_platform
          - -labsl_random_internal_randen
          - -labsl_random_internal_randen_hwaes
          - -labsl_random_internal_randen_hwaes_impl
          - -labsl_random_internal_randen_slow
          - -labsl_random_internal_seed_material
          - -labsl_random_seed_gen_exception
          - -labsl_random_seed_sequences
          - -labsl_raw_hash_set
          - -labsl_raw_logging_internal
          - -labsl_source_location
          - -labsl_spinlock_wait
          - -labsl_stacktrace
          - -labsl_status
          - -labsl_statusor
          - -labsl_str_format_internal
          - -labsl_strerror
          - -labsl_strings
          - -labsl_strings_internal
          - -labsl_symbolize
          - -labsl_synchronization
          - -labsl_throw_delegate
          - -labsl_time
          - -labsl_time_zone
          - -labsl_tracing_internal
          - -labsl_utf8_for_code_point
          - -labsl_vlog_config_internal
          - -lutf8_range
          - -lutf8_validity
          - -lz
          - -llz4
          # libvalhalla is built with ENABLE_HTTP=ON so the graph can stream
          # from the CDN, which brings the system libcurl.
          - -lcurl
    # Deliberately NO MapLibre dependency. The distributed XCFramework has
    # only ios-arm64 and ios-arm64_x86_64-simulator slices, so linking it
    # here would not build. macOS renders through MapLibre GL JS instead —
    # see Map/macOS/MapWebView.swift.
    dependencies:
      - package: GRDB
        product: GRDB
      - sdk: IOKit.framework
      - sdk: CoreFoundation.framework

  # The library store and the GPX reader/writer are the first code here that
  # is testable without a renderer, and GPX is the one place a silent bug
  # ships a broken file to a device. tachbase's own test bundle is the
  # template; note it has no coverage of its 55 migrations, which is the gap
  # DatabaseMigrationTests exists to not repeat.
  SwiftcampTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: SwiftcampTests
        excludes:
          - "Fixtures"
      # GPX fixtures. Declared as a resources build phase because XcodeGen
      # does not know what a .gpx is and leaves unrecognised files out of the
      # bundle, so `Bundle.url(forResource:)` finds nothing and every test
      # that reads one fails as "fixture not in the test bundle".
      - path: SwiftcampTests/Fixtures
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftcamp.app.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        # Spelled out because the target is `Swiftcamp-macOS` but its
        # PRODUCT_NAME is `Swiftcamp`. XcodeGen derives TEST_HOST from the
        # target name, which points at an executable that does not exist.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Swiftcamp.app/Contents/MacOS/Swiftcamp"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Swiftcamp-macOS

schemes:
  Swiftcamp-iOS:
    build:
      targets:
        Swiftcamp-iOS: all
    run:
      config: Debug
    archive:
      config: Release
  Swiftcamp-macOS:
    build:
      targets:
        Swiftcamp-macOS: all
    run:
      config: Debug
      # The developer override: a graph on local disk instead of the one
      # streamed from the CDN, which docs/routing.md builds at this path.
      # Listed but unchecked, so Run streams like a user's copy and the
      # override is one checkbox away in Edit Scheme. Xcode passes the
      # argument verbatim, so RoutingEngine expands the tilde itself.
      commandLineArguments:
        "-SwiftcampRouting ~/valhalla-data/colorado/valhalla.json": false
        # Stage timings for a route in the console; see Timing.swift.
        "-SwiftcampTiming YES": true
    test:
      config: Debug
      targets:
        - SwiftcampTests
    archive:
      config: Release
