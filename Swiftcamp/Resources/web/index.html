<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="maplibre-gl.css">
<style>
  html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  /* Attribution is drawn by SwiftUI over the web view, matching iOS, so
     the in-map control is suppressed rather than duplicated. */
  .maplibregl-ctrl-attrib, .maplibregl-ctrl-logo { display: none !important; }
</style>
</head>
<body>
<div id="map"></div>
<script src="maplibre-gl.js"></script>
<script src="pmtiles.js"></script>
<script>
// Forward console output and errors to Swift. Without this a failure in
// here is invisible — the web view just shows an empty page and the app
// has no idea anything went wrong.
// Every message to Swift is {type: ...}. Console output is one case among
// several rather than the channel itself: the app used to detect that the
// map had settled by matching the prefix of a log line, which meant any
// semantic event had to be smuggled through console.log.
function post(message) {
  try {
    window.webkit.messageHandlers.swiftcamp.postMessage(message);
  } catch (e) {}
}

(function () {
  // Forward console output and errors to Swift. Without this a failure in
  // here is invisible — the web view just shows an empty page and the app
  // has no idea anything went wrong.
  function send(level, args) {
    post({ type: 'console', level: level, text: Array.from(args).map(String).join(' ') });
  }
  ['log', 'warn', 'error'].forEach(function (level) {
    var original = console[level];
    console[level] = function () { send(level, arguments); original.apply(console, arguments); };
  });
  window.onerror = function (msg, src, line) { send('error', [msg + ' @' + src + ':' + line]); };
})();

(function () {
  // Registers the pmtiles:// protocol with MapLibre. Range requests from
  // here land on BundleSchemeHandler in Swift.
  var protocol = new pmtiles.Protocol();
  maplibregl.addProtocol('pmtiles', protocol.tile);

  var style = window.__SWIFTCAMP_STYLE__;
  if (!style) { console.error('style was not injected'); return; }

  // Debug camera override from -SwiftcampCenter / -SwiftcampZoom. Null in
  // every normal launch, so the defaults below are what ships.
  var camera = window.__SWIFTCAMP_CAMERA__ || {};

  var map = new maplibregl.Map({
    container: 'map',
    style: style,
    center: camera.center || [-104.99, 39.74],
    zoom: camera.zoom !== undefined ? camera.zoom : 13,
    maxZoom: window.__SWIFTCAMP_MAX_ZOOM__,
    attributionControl: false
  });

  // MapLibre GL JS sizes its canvas once and does not track its container.
  // On macOS the window is resizable and the web view starts at zero size
  // before SwiftUI lays it out, so without this the canvas stays at
  // whatever it was first measured at and the rest of the view renders as
  // empty background. Native handles this itself; the JS build does not.
  var resizeObserver = new ResizeObserver(function () { map.resize(); });
  resizeObserver.observe(document.getElementById('map'));

  // The bridge. Swift reaches the map only through here, and only after the
  // ready message below — `makeNSView` returns long before the style has
  // parsed, so a push sent any earlier finds no sources and is lost.
  window.swiftcamp = {
    // overlay is {sourceId: geojsonText}. The payload arrives as text and is
    // parsed here rather than being marshalled as a JS object across the
    // bridge, because the Swift side compares the encoded strings to decide
    // whether a push is needed at all.
    setOverlay: function (overlay) {
      Object.keys(overlay).forEach(function (id) {
        var source = map.getSource(id);
        if (!source) { console.error('no such source: ' + id); return; }
        try {
          source.setData(JSON.parse(overlay[id]));
        } catch (e) {
          console.error('bad geojson for ' + id + ': ' + e);
        }
      });
    },

    flyTo: function (lon, lat, zoom) {
      map.flyTo({ center: [lon, lat], zoom: zoom, duration: 600 });
    },

    fitBounds: function (west, south, east, north) {
      map.fitBounds([[west, south], [east, north]], { padding: 64, duration: 600 });
    },

    // Which route's via points can be dragged, or null. Known here and not
    // only in Swift because a drag begins by cancelling the map's own pan
    // on mousedown, and cancelling it for a dot that will not move leaves a
    // map that refuses to pan whenever the cursor is over one.
    setEditing: function (id) {
      editing = id || null;
      map.getCanvas().style.cursor = editing ? 'crosshair' : '';
    },

    // Scripted input for the -SwiftcampScript harness. Real DOM events on
    // the real canvas, so they run through MapLibre's hit testing and the
    // handlers above exactly as a mouse would. mousedown goes to the canvas
    // and the rest to the document, which is where MapLibre listens for a
    // drag that leaves the map.
    synthesize: function (kind, lon, lat, toLon, toLat, key) {
      var canvas = map.getCanvas();
      var rect = canvas.getBoundingClientRect();
      function at(lng, lt) {
        var p = map.project([lng, lt]);
        return { x: rect.left + p.x, y: rect.top + p.y };
      }
      // Exactly the sequence a mouse produces: a hover with no button
      // down, the press and release on the canvas, then the click. The
      // release must bubble from the canvas: MapLibre resets its drag
      // state on the release it sees, and one that starts anywhere else
      // leaves it believing the button is still down, after which the next
      // hover pans the map by the distance to the last press.
      function mouse(type, target, pt, buttons) {
        target.dispatchEvent(new MouseEvent(type, {
          bubbles: true, cancelable: true, view: window,
          clientX: pt.x, clientY: pt.y, screenX: pt.x, screenY: pt.y,
          button: 0, buttons: buttons
        }));
      }
      if (kind === 'click') {
        var p = at(lon, lat);
        mouse('mousemove', canvas, p, 0);
        mouse('mousedown', canvas, p, 1);
        mouse('mouseup', canvas, p, 0);
        mouse('click', canvas, p, 0);
      } else if (kind === 'drag') {
        var a = at(lon, lat), b = at(toLon, toLat);
        mouse('mousemove', canvas, a, 0);
        mouse('mousedown', canvas, a, 1);
        for (var i = 1; i <= 8; i++) {
          var t = i / 8;
          mouse('mousemove', canvas, { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }, 1);
        }
        mouse('mouseup', canvas, b, 0);
      } else if (kind === 'probe') {
        // What the renderer has at this spot. The answer to "why did that
        // click not hit" is here, never in reasoning about it.
        var q = at(lon, lat);
        var pt = [q.x - rect.left, q.y - rect.top];
        var hits = map.queryRenderedFeatures(pt, { layers: PICKABLE });
        console.log('probe ' + lon + ',' + lat + ' px ' + pt.map(Math.round) +
                    ' zoom ' + map.getZoom().toFixed(2) + ' hits ' +
                    hits.map(function (h) { return h.layer.id + ':' + JSON.stringify(h.properties); }).join(' | '));
      } else if (kind === 'key') {
        document.dispatchEvent(new KeyboardEvent('keydown', {
          key: key === 'delete' ? 'Backspace' : 'Escape', bubbles: true, cancelable: true
        }));
      }
    }
  };

  var editing = null;

  // Overlay layers, topmost first, so a click reports the thing the user
  // thinks they aimed at when a via point sits on its own route line.
  var PICKABLE = ['via-point', 'waypoint-dot', 'route-line', 'track-line'];

  map.on('click', function (e) {
    var hits = map.queryRenderedFeatures(e.point, { layers: PICKABLE });
    var hit = hits.length ? hits[0] : null;
    post({
      type: 'click',
      lon: e.lngLat.lng,
      lat: e.lngLat.lat,
      layer: hit ? hit.layer.id : null,
      id: hit ? (hit.properties.id || null) : null,
      seq: hit && hit.properties.seq !== undefined ? hit.properties.seq : null
    });
  });

  // A cursor that changes is the only affordance saying a dot can be grabbed.
  // While editing, empty map is a crosshair: clicking it places a point.
  map.on('mousemove', function (e) {
    if (dragging) return;
    var hits = map.queryRenderedFeatures(e.point, { layers: PICKABLE });
    var hit = hits.length ? hits[0] : null;
    var cursor = '';
    if (hit && hit.layer.id === 'via-point' && editing && hit.properties.id === editing) {
      cursor = 'grab';
    } else if (hit) {
      cursor = 'pointer';
    } else if (editing) {
      cursor = 'crosshair';
    }
    map.getCanvas().style.cursor = cursor;
  });

  // Dragging a via point. The standard MapLibre GL JS pattern: on mousedown
  // over the handle, preventDefault stops the map panning, then mousemove
  // follows the pointer until mouseup. Only the route being edited is
  // draggable, so a dot on any other route still lets the map pan under it.
  //
  // Moves are reported to Swift, which redraws the line from an in-memory
  // copy; the write happens once, on 'end'. Nothing is drawn from here
  // directly, so the page never holds a copy of the route that could
  // disagree with the library.
  var dragging = null;

  map.on('mousedown', 'via-point', function (e) {
    if (!editing) return;
    var feature = e.features && e.features[0];
    if (!feature || feature.properties.id !== editing) return;
    e.preventDefault();

    dragging = { id: feature.properties.id, seq: feature.properties.seq, moved: false, pending: null };
    map.getCanvas().style.cursor = 'grabbing';

    function report(phase, lngLat) {
      post({ type: 'drag', phase: phase, id: dragging.id, seq: dragging.seq,
             lon: lngLat.lng, lat: lngLat.lat });
    }

    // One report per frame, not per event. The pointer can raise several
    // mousemoves between frames and each report is an overlay rebuild.
    function onMove(ev) {
      dragging.moved = true;
      dragging.pending = ev.lngLat;
      if (dragging.frame) return;
      dragging.frame = requestAnimationFrame(function () {
        dragging.frame = null;
        if (dragging.pending) report('move', dragging.pending);
      });
    }

    function onUp(ev) {
      map.off('mousemove', onMove);
      if (dragging.frame) cancelAnimationFrame(dragging.frame);
      // A press with no movement is a click, and the click handler already
      // reports it. Reporting an 'end' here too would write a no-op edit
      // onto the undo stack.
      if (dragging.moved) report('end', ev.lngLat);
      dragging = null;
      map.getCanvas().style.cursor = 'grab';
    }

    map.on('mousemove', onMove);
    map.once('mouseup', onUp);
  });

  // Keys the app cares about, forwarded because the web view is first
  // responder while the mouse is over the map, so SwiftUI never sees them.
  document.addEventListener('keydown', function (e) {
    var key = null;
    if (e.key === 'Backspace' || e.key === 'Delete') key = 'delete';
    else if (e.key === 'Escape') key = 'escape';
    if (!key) return;
    e.preventDefault();
    post({ type: 'key', key: key });
  });

  map.on('load', function () {
    // 'load' rather than 'idle' for readiness: the style has parsed and its
    // sources exist, which is exactly the condition setOverlay needs. Waiting
    // for 'idle' would also wait on tiles arriving over the network, and an
    // imported route should draw before the basemap under it finishes.
    post({ type: 'ready' });
  });

  map.on('idle', function () {
    // Reported once: a non-zero feature count here proves the range requests
    // reached real data, and repeating it on every idle would bury the log.
    if (!map.__reported) {
      map.__reported = true;
      var features = map.queryRenderedFeatures();
      console.log('map idle, ' + map.getStyle().layers.length + ' layers, ' +
                  features.length + ' rendered features');
    }

    // The idle message itself fires EVERY time, so the snapshot harness
    // photographs the settled map rather than the first thing it drew.
    // Overlay data arrives after the basemap and on its own schedule, so a
    // one-shot snapshot caught the map before the route was on it and
    // reported an empty map as if the overlay had failed.
    post({ type: 'idle' });
  });

  map.on('error', function (e) { console.error('map error: ' + (e && e.error ? e.error.message : e)); });
})();
</script>
</body>
</html>
