<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="maplibre-gl.css">
<style>
  html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  /* Attribution is drawn by SwiftUI over the web view, matching iOS, so
     the in-map control is suppressed rather than duplicated. */
  .maplibregl-ctrl-attrib, .maplibregl-ctrl-logo { display: none !important; }
</style>
</head>
<body>
<div id="map"></div>
<script src="maplibre-gl.js"></script>
<script src="pmtiles.js"></script>
<script>
// Forward console output and errors to Swift. Without this a failure in
// here is invisible — the web view just shows an empty page and the app
// has no idea anything went wrong.
// Every message to Swift is {type: ...}. Console output is one case among
// several rather than the channel itself: the app used to detect that the
// map had settled by matching the prefix of a log line, which meant any
// semantic event had to be smuggled through console.log.
function post(message) {
  try {
    window.webkit.messageHandlers.swiftcamp.postMessage(message);
  } catch (e) {}
}

(function () {
  // Forward console output and errors to Swift. Without this a failure in
  // here is invisible — the web view just shows an empty page and the app
  // has no idea anything went wrong.
  function send(level, args) {
    post({ type: 'console', level: level, text: Array.from(args).map(String).join(' ') });
  }
  ['log', 'warn', 'error'].forEach(function (level) {
    var original = console[level];
    console[level] = function () { send(level, arguments); original.apply(console, arguments); };
  });
  window.onerror = function (msg, src, line) { send('error', [msg + ' @' + src + ':' + line]); };
})();

(function () {
  // Registers the pmtiles:// protocol with MapLibre. Range requests from
  // here land on BundleSchemeHandler in Swift.
  var protocol = new pmtiles.Protocol();
  maplibregl.addProtocol('pmtiles', protocol.tile);

  var style = window.__SWIFTCAMP_STYLE__;
  if (!style) { console.error('style was not injected'); return; }

  // Debug camera override from -SwiftcampCenter / -SwiftcampZoom. Null in
  // every normal launch, so the defaults below are what ships.
  var camera = window.__SWIFTCAMP_CAMERA__ || {};

  var map = new maplibregl.Map({
    container: 'map',
    style: style,
    center: camera.center || [-104.99, 39.74],
    zoom: camera.zoom !== undefined ? camera.zoom : 13,
    maxZoom: window.__SWIFTCAMP_MAX_ZOOM__,
    attributionControl: false
  });

  // MapLibre GL JS sizes its canvas once and does not track its container.
  // On macOS the window is resizable and the web view starts at zero size
  // before SwiftUI lays it out, so without this the canvas stays at
  // whatever it was first measured at and the rest of the view renders as
  // empty background. Native handles this itself; the JS build does not.
  var resizeObserver = new ResizeObserver(function () { map.resize(); });
  resizeObserver.observe(document.getElementById('map'));

  // The bridge. Swift reaches the map only through here, and only after the
  // ready message below — `makeNSView` returns long before the style has
  // parsed, so a push sent any earlier finds no sources and is lost.
  window.swiftcamp = {
    // overlay is {sourceId: geojsonText}. The payload arrives as text and is
    // parsed here rather than being marshalled as a JS object across the
    // bridge, because the Swift side compares the encoded strings to decide
    // whether a push is needed at all.
    setOverlay: function (overlay) {
      Object.keys(overlay).forEach(function (id) {
        var source = map.getSource(id);
        if (!source) { console.error('no such source: ' + id); return; }
        try {
          source.setData(JSON.parse(overlay[id]));
        } catch (e) {
          console.error('bad geojson for ' + id + ': ' + e);
        }
      });
    },

    flyTo: function (lon, lat, zoom) {
      map.flyTo({ center: [lon, lat], zoom: zoom, duration: 600 });
    },

    fitBounds: function (west, south, east, north) {
      map.fitBounds([[west, south], [east, north]], { padding: 64, duration: 600 });
    }
  };

  // Overlay layers, topmost first, so a click reports the thing the user
  // thinks they aimed at when a via point sits on its own route line.
  var PICKABLE = ['via-point', 'waypoint-dot', 'route-line', 'track-line'];

  map.on('click', function (e) {
    var hits = map.queryRenderedFeatures(e.point, { layers: PICKABLE });
    var hit = hits.length ? hits[0] : null;
    post({
      type: 'click',
      lon: e.lngLat.lng,
      lat: e.lngLat.lat,
      layer: hit ? hit.layer.id : null,
      id: hit ? (hit.properties.id || null) : null,
      seq: hit && hit.properties.seq !== undefined ? hit.properties.seq : null
    });
  });

  // A cursor that changes is the only affordance saying a dot can be grabbed.
  map.on('mousemove', function (e) {
    var hits = map.queryRenderedFeatures(e.point, { layers: PICKABLE });
    map.getCanvas().style.cursor = hits.length ? 'pointer' : '';
  });

  map.on('load', function () {
    // 'load' rather than 'idle' for readiness: the style has parsed and its
    // sources exist, which is exactly the condition setOverlay needs. Waiting
    // for 'idle' would also wait on tiles arriving over the network, and an
    // imported route should draw before the basemap under it finishes.
    post({ type: 'ready' });
  });

  map.on('idle', function () {
    // Reported once, for the snapshot harness. 'idle' here rather than
    // 'load' because it fires after tiles have actually been fetched,
    // decoded and drawn, so a non-zero feature count proves the range
    // requests reached real data.
    if (map.__reported) { return; }
    map.__reported = true;
    var features = map.queryRenderedFeatures();
    console.log('map idle, ' + map.getStyle().layers.length + ' layers, ' +
                features.length + ' rendered features');
    post({ type: 'idle' });
  });

  map.on('error', function (e) { console.error('map error: ' + (e && e.error ? e.error.message : e)); });
})();
</script>
</body>
</html>
