<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="maplibre-gl.css">
<style>
  html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  /* Attribution is drawn by SwiftUI over the web view, matching iOS, so
     the in-map control is suppressed rather than duplicated. */
  .maplibregl-ctrl-attrib, .maplibregl-ctrl-logo { display: none !important; }
  /* The readout under the pointer, drawn to look like a Mac tooltip. */
  #tip {
    position: fixed; z-index: 10; display: none; pointer-events: none;
    max-width: 260px; padding: 5px 8px; border-radius: 5px;
    background: rgba(255, 255, 255, 0.96); color: #1d1d1f;
    border: 0.5px solid rgba(0, 0, 0, 0.18);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
    font: 11px/1.45 -apple-system, "SF Pro Text", system-ui, sans-serif;
    white-space: nowrap;
  }
  #tip b { font-weight: 600; }
  #tip .kind { color: #6e6e73; }
  #tip .row { display: flex; gap: 10px; justify-content: space-between; }
  #tip .row span:last-child { font-variant-numeric: tabular-nums; }
  /* A forest's name runs to fifty characters; let that one line wrap. */
  #tip .wrap { white-space: normal; }
  /* Where the pointer is and how high the ground is there, bottom right,
     in the attribution capsule's dress. */
  #readout {
    position: fixed; right: 8px; bottom: 8px; z-index: 10; display: none; pointer-events: none;
    padding: 3px 8px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.82); color: #1d1d1f;
    border: 0.5px solid rgba(0, 0, 0, 0.12);
    font: 10px/1.4 -apple-system, "SF Pro Text", system-ui, sans-serif;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="tip"></div>
<div id="readout"></div>
<script src="maplibre-gl.js"></script>
<script src="pmtiles.js"></script>
<script src="maplibre-contour.js"></script>
<script>
// Forward console output and errors to Swift. Without this a failure in
// here is invisible — the web view just shows an empty page and the app
// has no idea anything went wrong.
// Every message to Swift is {type: ...}. Console output is one case among
// several rather than the channel itself: the app used to detect that the
// map had settled by matching the prefix of a log line, which meant any
// semantic event had to be smuggled through console.log.
function post(message) {
  try {
    window.webkit.messageHandlers.swiftcamp.postMessage(message);
  } catch (e) {}
}

(function () {
  // Forward console output and errors to Swift. Without this a failure in
  // here is invisible — the web view just shows an empty page and the app
  // has no idea anything went wrong.
  function send(level, args) {
    post({ type: 'console', level: level, text: Array.from(args).map(String).join(' ') });
  }
  ['log', 'warn', 'error'].forEach(function (level) {
    var original = console[level];
    console[level] = function () { send(level, arguments); original.apply(console, arguments); };
  });
  window.onerror = function (msg, src, line) { send('error', [msg + ' @' + src + ':' + line]); };
})();

(function () {
  // Registers the pmtiles:// protocol with MapLibre. Range requests from
  // here land on BundleSchemeHandler in Swift.
  var protocol = new pmtiles.Protocol();
  maplibregl.addProtocol('pmtiles', protocol.tile);

  var style = window.__SWIFTCAMP_STYLE__;
  if (!style) { console.error('style was not injected'); return; }

  // Contour lines, made here from the terrain the hillshade draws. The
  // library fetches its DEM tiles by URL, and ours are inside a PMTiles
  // archive, so its manager's fetch is replaced by a read through the
  // same PMTiles instance the map's protocol uses: one directory cache,
  // one set of range requests. On the main thread rather than a worker,
  // since the replacement lives here; a contour tile is a few
  // milliseconds of marching squares. The style's placeholder URL is
  // swapped for the library's own before the map ever reads it.
  if (style.sources.contours && window.mlcontour && style.sources.terrain) {
    var demArchive = style.sources.terrain.url.replace(/^pmtiles:\/\//, '');
    var demSource = new mlcontour.DemSource({
      url: 'pmtiles-dem://{z}/{x}/{y}', encoding: 'terrarium', maxzoom: 12, worker: false, cacheSize: 120
    });
    demSource.manager.getTile = function (url, abort) {
      var m = /(\d+)\/(\d+)\/(\d+)$/.exec(url);
      var pm = (protocol.tiles && protocol.tiles.get(demArchive)) || new pmtiles.PMTiles(demArchive);
      return pm.getZxy(+m[1], +m[2], +m[3], abort && abort.signal).then(function (r) {
        if (!r || !r.data) throw new Error('no terrain tile ' + url);
        return { data: new Blob([r.data]) };
      });
    };
    demSource.setupMaplibre(maplibregl);
    var intervals = (style.metadata || {})['swiftcamp:contours'] || {};
    style.sources.contours.tiles = [demSource.contourProtocolUrl({
      multiplier: intervals.multiplier || 1,
      thresholds: intervals.thresholds || {},
      elevationKey: 'ele', levelKey: 'level', contourLayer: 'contours',
      // From the z(n-1) DEM for a z(n) contour tile: a 512 px DEM tile has
      // detail to spare, and it needs three neighbours rather than eight.
      overzoom: 1
    })];
  } else if (style.sources.contours) {
    // Nothing to make the tiles with: no source, rather than a request
    // per tile to a protocol nobody answers.
    delete style.sources.contours;
    style.layers = style.layers.filter(function (l) { return l.source !== 'contours'; });
  }

  // Debug camera override from -SwiftcampCenter / -SwiftcampZoom. Null in
  // every normal launch, so the defaults below are what ships.
  var camera = window.__SWIFTCAMP_CAMERA__ || {};

  var map = new maplibregl.Map({
    container: 'map',
    style: style,
    center: camera.center || [-104.99, 39.74],
    zoom: camera.zoom !== undefined ? camera.zoom : 13,
    maxZoom: window.__SWIFTCAMP_MAX_ZOOM__,
    attributionControl: false,
    // Right-drag would rotate the map, and the right button is the context
    // menu instead. A native menu also swallows the release, so MapLibre
    // would be left believing the button was still down and the next hover
    // would spin the map. North-up is what a planner wants anyway.
    dragRotate: false
  });

  // MapLibre GL JS sizes its canvas once and does not track its container.
  // On macOS the window is resizable and the web view starts at zero size
  // before SwiftUI lays it out, so without this the canvas stays at
  // whatever it was first measured at and the rest of the view renders as
  // empty background. Native handles this itself; the JS build does not.
  var resizeObserver = new ResizeObserver(function () { map.resize(); });
  resizeObserver.observe(document.getElementById('map'));

  // The bridge. Swift reaches the map only through here, and only after the
  // ready message below — `makeNSView` returns long before the style has
  // parsed, so a push sent any earlier finds no sources and is lost.
  window.swiftcamp = {
    // overlay is {sourceId: geojsonText}. The payload arrives as text and is
    // parsed here rather than being marshalled as a JS object across the
    // bridge, because the Swift side compares the encoded strings to decide
    // whether a push is needed at all.
    setOverlay: function (overlay) {
      Object.keys(overlay).forEach(function (id) {
        var source = map.getSource(id);
        if (!source) { console.error('no such source: ' + id); return; }
        try {
          var t0 = performance.now();
          var data = JSON.parse(overlay[id]);
          var t1 = performance.now();
          source.setData(data);
          if (window.__SWIFTCAMP_TIMING__) {
            console.log('timing overlay.apply ' + id + ': parse ' + (t1 - t0).toFixed(0) + ' ms, setData ' +
                        (performance.now() - t1).toFixed(0) + ' ms, ' + Math.round(overlay[id].length / 1000) + ' KB');
            overlayAppliedAt = performance.now();
          }
        } catch (e) {
          console.error('bad geojson for ' + id + ': ' + e);
        }
      });
    },

    flyTo: function (lon, lat, zoom) {
      map.flyTo({ center: [lon, lat], zoom: zoom, duration: 600 });
    },

    fitBounds: function (west, south, east, north) {
      map.fitBounds([[west, south], [east, north]], { padding: 64, duration: 600 });
    },

    // Which route is being edited, or null. While set, empty map is a
    // crosshair because a click there adds a point to it. Dragging needs
    // no mode: every route's dots and line can be grabbed.
    // 3-D terrain from the same DEM the hillshade draws, with the camera
    // tilted to show it, and back to flat north-up. The exaggeration is
    // mild: a touring map wants the valley read, not a theme park.
    setTerrain: function (on) {
      if (on) {
        if (!map.getTerrain()) map.setTerrain({ source: 'terrain', exaggeration: 1.3 });
        map.easeTo({ pitch: 55, duration: 600 });
      } else {
        map.easeTo({ pitch: 0, bearing: 0, duration: 600 });
        if (map.getTerrain()) setTimeout(function () { map.setTerrain(null); }, 650);
      }
    },
    // From the View menu and the compass. The tilt stays: facing north
    // in 3-D is still looking at the mountain.
    rotateBy: function (degrees) {
      map.easeTo({ bearing: map.getBearing() + degrees, duration: 300 });
    },
    faceNorth: function () {
      map.easeTo({ bearing: 0, duration: 400 });
    },
    // The dirt bike trails, on or off. Every layer the style declares
    // under the prefix, so a layer added there needs nothing here.
    setTrails: function (on) {
      trailsOn = on;
      style.layers.forEach(function (l) {
        if (l.id.indexOf(TRAIL_PREFIX) === 0 && map.getLayer(l.id)) {
          map.setLayoutProperty(l.id, 'visibility', on ? 'visible' : 'none');
        }
      });
      if (!on) hideTip();
    },
    // Contour lines on or off, every layer under the prefix, as trails.
    setContours: function (on) {
      style.layers.forEach(function (l) {
        if (l.id.indexOf('contour-') === 0 && map.getLayer(l.id)) {
          map.setLayoutProperty(l.id, 'visibility', on ? 'visible' : 'none');
        }
      });
    },
    setEditing: function (id) {
      editing = id || null;
      map.getCanvas().style.cursor = editing ? 'crosshair' : '';
    },
    // The track whose fixes are out as handles, or null. Its line can
    // then be grabbed to add a fix; any other track's line is only a line.
    setEditingTrack: function (id) {
      editingTrack = id || null;
    },

    // Scripted input for the -SwiftcampScript harness. Real DOM events on
    // the real canvas, so they run through MapLibre's hit testing and the
    // handlers above exactly as a mouse would. mousedown goes to the canvas
    // and the rest to the document, which is where MapLibre listens for a
    // drag that leaves the map.
    synthesize: function (kind, lon, lat, toLon, toLat, key) {
      var canvas = map.getCanvas();
      var rect = canvas.getBoundingClientRect();
      function at(lng, lt) {
        var p = map.project([lng, lt]);
        return { x: rect.left + p.x, y: rect.top + p.y };
      }
      // Exactly the sequence a mouse produces: a hover with no button
      // down, the press and release on the canvas, then the click. The
      // release must bubble from the canvas: MapLibre resets its drag
      // state on the release it sees, and one that starts anywhere else
      // leaves it believing the button is still down, after which the next
      // hover pans the map by the distance to the last press.
      function mouse(type, target, pt, buttons) {
        target.dispatchEvent(new MouseEvent(type, {
          bubbles: true, cancelable: true, view: window,
          clientX: pt.x, clientY: pt.y, screenX: pt.x, screenY: pt.y,
          button: 0, buttons: buttons
        }));
      }
      if (kind === 'click') {
        var p = at(lon, lat);
        mouse('mousemove', canvas, p, 0);
        mouse('mousedown', canvas, p, 1);
        mouse('mouseup', canvas, p, 0);
        mouse('click', canvas, p, 0);
      } else if (kind === 'drag') {
        // One move per frame, the way a mouse delivers them. Dispatching
        // them all in one tick coalesced into a single report that the
        // release then cancelled, so the live re-routing a real drag runs
        // through was never exercised: the check passed on the release
        // path alone.
        var a = at(lon, lat), b = at(toLon, toLat), steps = 8, i = 0;
        mouse('mousemove', canvas, a, 0);
        mouse('mousedown', canvas, a, 1);
        (function step() {
          i += 1;
          var t = i / steps;
          mouse('mousemove', canvas, { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }, 1);
          if (i < steps) requestAnimationFrame(step);
          else requestAnimationFrame(function () { mouse('mouseup', canvas, b, 0); });
        })();
      } else if (kind === 'altdrag') {
        // The same drag with Option held, which turns the map.
        var a2 = at(lon, lat), b2 = at(toLon, toLat), n2 = 8, j = 0;
        function altMouse(type, target, pt, buttons) {
          target.dispatchEvent(new MouseEvent(type, {
            bubbles: true, cancelable: true, view: window, altKey: true,
            clientX: pt.x, clientY: pt.y, screenX: pt.x, screenY: pt.y, button: 0, buttons: buttons
          }));
        }
        altMouse('mousemove', canvas, a2, 0);
        altMouse('mousedown', canvas, a2, 1);
        (function step2() {
          j += 1;
          var t = j / n2;
          altMouse('mousemove', canvas, { x: a2.x + (b2.x - a2.x) * t, y: a2.y + (b2.y - a2.y) * t }, 1);
          if (j < n2) requestAnimationFrame(step2);
          else requestAnimationFrame(function () { altMouse('mouseup', canvas, b2, 0); });
        })();
      } else if (kind === 'hover') {
        // A move with no button down, then a repaint so the snapshot
        // harness, which photographs on idle, sees the tooltip the move
        // put up: a tooltip is DOM, and DOM changes do not make the map
        // render.
        mouse('mousemove', canvas, at(lon, lat), 0);
        map.triggerRepaint();
      } else if (kind === 'contextmenu') {
        // The sequence macOS produces for the right button: press, the
        // contextmenu event, release. MapLibre holds a contextmenu that
        // follows a press until the release arrives, so sending the
        // contextmenu event alone reports nothing, ever.
        var c = at(lon, lat);
        mouse('mousemove', canvas, c, 0);
        canvas.dispatchEvent(new MouseEvent('mousedown', {
          bubbles: true, cancelable: true, view: window,
          clientX: c.x, clientY: c.y, screenX: c.x, screenY: c.y, button: 2, buttons: 2
        }));
        canvas.dispatchEvent(new MouseEvent('contextmenu', {
          bubbles: true, cancelable: true, view: window,
          clientX: c.x, clientY: c.y, screenX: c.x, screenY: c.y, button: 2, buttons: 2
        }));
        canvas.dispatchEvent(new MouseEvent('mouseup', {
          bubbles: true, cancelable: true, view: window,
          clientX: c.x, clientY: c.y, screenX: c.x, screenY: c.y, button: 2, buttons: 0
        }));
      } else if (kind === 'probe') {
        // What the renderer has at this spot. The answer to "why did that
        // click not hit" is here, never in reasoning about it.
        var q = at(lon, lat);
        var pt = [q.x - rect.left, q.y - rect.top];
        var hits = map.queryRenderedFeatures(pt, { layers: PICKABLE });
        console.log('probe ' + lon + ',' + lat + ' px ' + pt.map(Math.round) +
                    ' zoom ' + map.getZoom().toFixed(2) + ' hits ' +
                    hits.map(function (h) { return h.layer.id + ':' + JSON.stringify(h.properties); }).join(' | '));
      } else if (kind === 'key') {
        document.dispatchEvent(new KeyboardEvent('keydown', {
          key: key === 'delete' ? 'Backspace' : 'Escape', bubbles: true, cancelable: true
        }));
      }
    }
  };

  var editing = null;
  var editingTrack = null;

  // Overlay layers, topmost first, so a click reports the thing the user
  // thinks they aimed at when a via point sits on its own route line. The
  // route's casing rather than its stroke: the stroke is four pixels wide
  // at city zooms and the casing seven, and a line that is to be grabbed
  // needs the fatter target. Both draw from the same features, so a hit on
  // either carries the same properties.
  var PICKABLE = ['search-pin', 'nearby-point', 'via-point', 'waypoint-icon', 'track-point', 'route-casing', 'track-line'];

  // The trails layers, for the hover only: a trail is something to read
  // about, never to click or drag, so it stays out of PICKABLE and a click
  // on one still lands on the ground under it. The strokes, not the
  // casings, which carry the same features.
  var TRAIL_PREFIX = 'trails-';
  var TRAIL_LAYERS = style.layers
    .filter(function (l) { return l.id.indexOf(TRAIL_PREFIX) === 0 && !/-casing$/.test(l.id); })
    .map(function (l) { return l.id; });
  var trailsOn = false;

  // A trail is two to four pixels wide, too thin to land the pointer on,
  // so the hover looks a few pixels around it. Forest Service lines are
  // drawn on top, and are listed first here for the same reason: where
  // both sources have the trail, theirs is the legal record.
  function trailAt(point) {
    if (!trailsOn) return null;
    var pad = 4;
    var hits = map.queryRenderedFeatures([[point.x - pad, point.y - pad], [point.x + pad, point.y + pad]],
                                         { layers: TRAIL_LAYERS });
    hits.sort(function (a, b) { return (b.properties.source === 'mvum') - (a.properties.source === 'mvum'); });
    return hits.length ? hits[0] : null;
  }

  // What is under a point, in the shape Swift decodes for a click.
  function describe(point, lngLat) {
    var hits = map.queryRenderedFeatures(point, { layers: PICKABLE });
    var hit = hits.length ? hits[0] : null;
    return {
      lon: lngLat.lng,
      lat: lngLat.lat,
      layer: hit ? hit.layer.id : null,
      id: hit ? (hit.properties.id || null) : null,
      seq: hit && hit.properties.seq !== undefined ? hit.properties.seq : null
    };
  }

  map.on('click', function (e) {
    if (swallowClick) { swallowClick = false; return; }
    post(Object.assign({ type: 'click' }, describe(e.point, e.lngLat)));
  });

  // Right-click. WebKit's own menu is suppressed and what is under the
  // pointer is reported instead, with the pixel, and Swift puts up a
  // native menu there. The items are the model's actions, and a menu drawn
  // in the page would look like a web page inside a Mac app. The pixel is
  // in the map's coordinates, which are the web view's: the map fills the
  // page.
  map.on('contextmenu', function (e) {
    e.originalEvent.preventDefault();
    post(Object.assign({ type: 'contextmenu', x: e.point.x, y: e.point.y },
                       describe(e.point, e.lngLat)));
  });

  // A cursor that changes is the only affordance saying a dot can be grabbed.
  // While editing, empty map is a crosshair: clicking it places a point.
  map.on('mousemove', function (e) {
    if (dragging) return;
    var hits = map.queryRenderedFeatures(e.point, { layers: PICKABLE });
    var hit = hits.length ? hits[0] : null;
    hover(hit, e.point);
    var cursor = '';
    if (hit && (hit.layer.id === 'via-point' || hit.layer.id === 'route-casing' ||
                hit.layer.id === 'waypoint-icon' || hit.layer.id === 'track-point' ||
                (hit.layer.id === 'track-line' && hit.properties.id === editingTrack))) {
      cursor = 'grab';
    } else if (hit) {
      cursor = 'pointer';
    } else if (editing) {
      cursor = 'crosshair';
    }
    map.getCanvas().style.cursor = cursor;
  });

  // The readout under the pointer: what a point is, where it is, how far
  // along the route, and how high. Built here rather than in Swift because
  // it follows the pointer and a round trip per mouse move would lag; the
  // facts it shows travel on the feature, except elevation, which is read
  // off the terrain tiles below.
  var tip = document.getElementById('tip');
  var tipKey = null;

  function hover(hit, point) {
    var pointLayer = hit && (hit.layer.id === 'via-point' || hit.layer.id === 'waypoint-icon' ||
                             hit.layer.id === 'search-pin' || hit.layer.id === 'track-point' ||
                             hit.layer.id === 'nearby-point');
    // A trail only when nothing of the library is under the pointer:
    // over a route the route is what the rider is pointing at.
    var trail = !hit ? trailAt(point) : null;
    if (!pointLayer && !trail) { hideTip(); return; }

    if (trail) {
      var t = trail.properties;
      var trailKey = 'trail:' + t.source + ':' + (t.ref || '') + ':' + (t.name || '') + ':' + (t.dates || '');
      if (trailKey !== tipKey) {
        tipKey = trailKey;
        tip.innerHTML = describeTrail(t);
      }
    } else {
      var p = hit.properties;
      var key = hit.layer.id + ':' + p.id + ':' + (p.seq === undefined ? '' : p.seq);
      if (key !== tipKey) {
        tipKey = key;
        tip.innerHTML = describePoint(hit.layer.id, p);
        lookupElevation(p.lon, p.lat, key);
      }
    }
    tip.style.display = 'block';
    // Beside the pointer, and kept on the map when the pointer is near an
    // edge: a tooltip that is half off screen is a tooltip nobody reads.
    var w = tip.offsetWidth, h = tip.offsetHeight;
    var x = point.x + 14, y = point.y + 14;
    if (x + w > window.innerWidth - 8) x = point.x - w - 14;
    if (y + h > window.innerHeight - 8) y = point.y - h - 14;
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
  }

  function hideTip() {
    tip.style.display = 'none';
    tipKey = null;
  }

  map.getCanvas().addEventListener('mouseleave', hideTip);
  map.on('mousedown', hideTip);

  // The readout: position at once, elevation when the lookup lands, and
  // only one lookup in flight, so a fast sweep across a mountain does not
  // queue a tile fetch per pixel. Shown while the pointer is on the map.
  var readout = document.getElementById('readout');
  var readoutLookup = null, readoutPending = null;

  function updateReadout(lngLat) {
    readout.style.display = 'block';
    var position = formatPosition(lngLat.lat, lngLat.lng);
    readout.textContent = position;
    var ask = function () {
      var at = readoutPending; readoutPending = null;
      readoutLookup = elevationAt(at.lng, at.lat).then(function (metres) {
        readoutLookup = null;
        if (metres !== null && readout.textContent.indexOf(formatPosition(at.lat, at.lng)) === 0) {
          readout.textContent = formatPosition(at.lat, at.lng) + ' \u00b7 '
            + Math.round(metres * 3.28084).toLocaleString('en-US') + ' ft';
        }
        if (readoutPending) ask();
      }).catch(function () { readoutLookup = null; });
    };
    readoutPending = lngLat;
    if (!readoutLookup) ask();
  }
  map.on('mousemove', function (e) { updateReadout(e.lngLat); });
  map.getCanvas().addEventListener('mouseleave', function () { readout.style.display = 'none'; });

  function escapeHTML(text) {
    return String(text).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function describePoint(layer, p) {
    var kind, title;
    if (layer === 'waypoint-icon') {
      kind = 'Waypoint';
      title = p.name || 'Waypoint';
    } else if (layer === 'search-pin') {
      kind = 'Search result';
      title = p.name || kind;
    } else if (layer === 'nearby-point') {
      kind = p.detail || 'Found nearby';
      title = p.name || kind;
    } else if (layer === 'track-point') {
      kind = 'Track point';
      title = 'Point ' + (p.seq + 1);
    } else if (p.via === false) {
      kind = 'Shaping point';
      title = kind;
    } else {
      kind = 'Via point';
      title = p.name || ('Via point ' + (p.seq + 1));
    }
    var rows = ['<div><b>' + escapeHTML(title) + '</b></div>'];
    if (title !== kind) rows.push('<div class="kind">' + kind + '</div>');
    rows.push(row('Position', formatPosition(p.lat, p.lon)));
    if (p.distance !== undefined) rows.push(row('From start', formatMiles(p.distance)));
    rows.push(row('Elevation', '<span id="tip-ele">…</span>'));
    return rows.join('');
  }

  // What a trail is and who may ride it, from the properties
  // scripts/build-trails.py writes. Says where the claim comes from,
  // because a legal claim is only as good as its source.
  function describeTrail(t) {
    var kind = { road: 'Road', trail: 'Trail', single: 'Single-track' }[t.kind] || 'Trail';
    var title = t.name || (t.ref ? (t.source === 'mvum' ? 'Forest ' + kind.toLowerCase() + ' ' + t.ref : t.ref) : kind);
    var rows = ['<div><b>' + escapeHTML(title) + '</b></div>'];
    // A named trail says what it is underneath; an unnamed one already
    // said so in its title.
    if (t.name) rows.push('<div class="kind">' + kind + (t.ref ? ' ' + escapeHTML(t.ref) : '') + '</div>');
    var who = { any: 'Any, plated or not', street: 'Street-legal only', unknown: 'Not stated' }[t.legal] || 'Not stated';
    rows.push(row('Motorcycles', who));
    if (t.source === 'mvum') {
      rows.push(row('Open', t.dates === 'seasonal' ? 'Seasonal, dates not listed'
                          : t.dates ? formatOpenDates(t.dates) : 'Yearlong'));
    } else if (t.restriction) {
      rows.push(row('Restriction', escapeHTML(t.restriction)));
    }
    if (t.surface) rows.push(row('Surface', escapeHTML(t.surface)));
    if (t.forest) rows.push('<div class="kind wrap">' + escapeHTML(t.forest) + '</div>');
    rows.push('<div class="kind">' + (t.source === 'mvum' ? 'Forest Service MVUM' : 'OpenStreetMap') + '</div>');
    return rows.join('');
  }

  // The MVUM writes open dates as MM/DD-MM/DD, comma separated when a
  // trail opens twice a year: "06/01-08/19,11/16-11/30".
  function formatOpenDates(text) {
    var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    function day(md) {
      var m = /^(\d\d)\/(\d\d)$/.exec(md.trim());
      return m ? months[parseInt(m[1], 10) - 1] + ' ' + parseInt(m[2], 10) : md;
    }
    return text.split(',').map(function (span) {
      var ends = span.split('-');
      return ends.length === 2 ? day(ends[0]) + ' \u2013 ' + day(ends[1]) : span;
    }).map(escapeHTML).join(', ');
  }

  function row(label, value) {
    return '<div class="row"><span class="kind">' + label + '</span><span>' + value + '</span></div>';
  }

  // Five decimals is about a metre, which is as much as a rider can use
  // and as much as the file stores meaningfully.
  function formatPosition(lat, lon) {
    return lat.toFixed(5) + ', ' + lon.toFixed(5);
  }

  // Miles, the way the sidebar shows them: a decimal under ten, whole
  // above, because this is a US touring app and its GPS is set the same.
  function formatMiles(metres) {
    var miles = metres / 1609.344;
    return (miles < 10 ? miles.toFixed(1) : Math.round(miles)) + ' mi';
  }

  // Elevation, read off the same Terrarium tiles the hillshade draws. The
  // map cannot answer this itself without 3-D terrain switched on, which
  // changes how everything renders, so the tile is fetched through the
  // PMTiles protocol the map already uses and the pixel decoded here.
  // Always the archive's deepest zoom: a point wants the finest sample,
  // not whatever the current view happens to be drawing.
  var demTiles = {};

  function lookupElevation(lon, lat, key) {
    elevationAt(lon, lat).then(function (metres) {
      if (tipKey !== key) return;
      var slot = document.getElementById('tip-ele');
      if (!slot) return;
      if (metres === null) { slot.parentNode.remove(); return; }
      slot.textContent = Math.round(metres * 3.28084).toLocaleString('en-US') + ' ft';
    }).catch(function (e) { console.warn('elevation lookup failed: ' + e); });
  }

  async function elevationAt(lon, lat) {
    var source = style.sources.terrain;
    if (!source || !source.url) return null;
    var archive = source.url.replace(/^pmtiles:\/\//, '');
    // The protocol keeps one PMTiles instance per archive with its
    // directory cached; borrow it rather than fetching the directory again.
    var pm = (protocol.tiles && protocol.tiles.get(archive)) || new pmtiles.PMTiles(archive);
    var header = await pm.getHeader();
    var z = header.maxZoom;
    var n = Math.pow(2, z);
    var latRad = lat * Math.PI / 180;
    var xf = (lon + 180) / 360 * n;
    var yf = (1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n;
    var x = Math.floor(xf), y = Math.floor(yf);
    var tileKey = z + '/' + x + '/' + y;

    if (!demTiles[tileKey]) {
      demTiles[tileKey] = pm.getZxy(z, x, y).then(async function (resp) {
        if (!resp || !resp.data || !resp.data.byteLength) return null;
        var bitmap = await createImageBitmap(new Blob([resp.data]));
        var canvas = document.createElement('canvas');
        canvas.width = bitmap.width; canvas.height = bitmap.height;
        var ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(bitmap, 0, 0);
        return { pixels: ctx.getImageData(0, 0, bitmap.width, bitmap.height), size: bitmap.width };
      });
    }
    var tile = await demTiles[tileKey];
    if (!tile) return null;
    var px = Math.min(tile.size - 1, Math.floor((xf - x) * tile.size));
    var py = Math.min(tile.size - 1, Math.floor((yf - y) * tile.size));
    var i = (py * tile.size + px) * 4;
    var d = tile.pixels.data;
    // Terrarium: metres = (R * 256 + G + B / 256) - 32768.
    return (d[i] * 256 + d[i + 1] + d[i + 2] / 256) - 32768;
  }

  // Dragging. Two things on any route can be picked up: a via point, which
  // moves, and the line itself, which grows a new via point where it was
  // grabbed and moves that — the Google Maps gesture of pulling a route
  // onto a different road. No mode is needed and grabbing a route selects
  // it. Either way it is the standard MapLibre GL JS pattern: on mousedown
  // over the target, preventDefault stops the map panning, then mousemove
  // follows the pointer until mouseup. The map still pans from anywhere
  // that is not a dot or a line.
  //
  // Moves are reported to Swift, which routes the legs either side and
  // redraws the line from an in-memory copy; the write happens once, on
  // 'end'. Nothing is drawn from here directly, so the page never holds a
  // copy of the route that could disagree with the library.
  var dragging = null;

  // MapLibre's own threshold between a click and a drag, so the two agree.
  // A press that travels less than this is a click, and the click handler
  // reports it; reporting a drag for it as well would write a no-op edit
  // onto the undo stack, or for a grab on the line insert a second point.
  var CLICK_TOLERANCE = 3;

  // MapLibre measures press to release, not the furthest excursion, so a
  // drag that wanders out and back can still end in a click. Set when a
  // drag has been reported so that click is dropped, and cleared on the
  // next press in case none came.
  var swallowClick = false;

  map.on('mousedown', function () { swallowClick = false; });

  function beginDrag(e, layer, id, seq) {
    // The left button only. The right one is the context menu, and a
    // drag begun by it would still be waiting for its release when the
    // native menu takes the pointer. Not with Option, which turns the map
    // from wherever it is pressed, a route's line included.
    if (e.originalEvent.button !== 0 || e.originalEvent.altKey) return;
    e.preventDefault();
    dragging = { layer: layer, id: id, seq: seq, down: e.lngLat, downPoint: e.point,
                 moved: false, pending: null, frame: null };
    map.getCanvas().style.cursor = 'grabbing';

    function report(phase, lngLat) {
      post({ type: 'drag', phase: phase, layer: dragging.layer, id: dragging.id, seq: dragging.seq,
             lon: lngLat.lng, lat: lngLat.lat });
    }

    // One report per frame, not per event. The pointer can raise several
    // mousemoves between frames and each report is a routing pass.
    function onMove(ev) {
      if (!dragging.moved) {
        if (ev.point.dist(dragging.downPoint) < CLICK_TOLERANCE) return;
        dragging.moved = true;
        // Where the press landed, which for a grab on the line is where
        // the new via point goes.
        report('begin', dragging.down);
      }
      dragging.pending = ev.lngLat;
      if (dragging.frame) return;
      dragging.frame = requestAnimationFrame(function () {
        dragging.frame = null;
        if (dragging.pending) report('move', dragging.pending);
      });
    }

    function onUp(ev) {
      map.off('mousemove', onMove);
      if (dragging.frame) cancelAnimationFrame(dragging.frame);
      if (dragging.moved) {
        report('end', ev.lngLat);
        swallowClick = true;
      }
      dragging = null;
      map.getCanvas().style.cursor = 'grab';
    }

    map.on('mousemove', onMove);
    map.once('mouseup', onUp);
  }

  map.on('mousedown', 'via-point', function (e) {
    if (dragging) return;
    var feature = e.features && e.features[0];
    if (!feature) return;
    beginDrag(e, 'via-point', feature.properties.id, feature.properties.seq);
  });

  // A waypoint moves whole. Its name and symbol travel with it, and the
  // release is the edit, the same as a via point.
  map.on('mousedown', 'waypoint-icon', function (e) {
    if (dragging) return;
    var feature = e.features && e.features[0];
    if (!feature) return;
    beginDrag(e, 'waypoint-icon', feature.properties.id, null);
  });

  // Registered after the via-point handler, and MapLibre fires them in
  // that order, so a press on a dot that sits on its own line starts one
  // drag, of the dot.
  map.on('mousedown', 'route-casing', function (e) {
    if (dragging) return;
    var feature = e.features && e.features[0];
    if (!feature) return;
    beginDrag(e, 'route-casing', feature.properties.id, null);
  });

  // Turning the map. MapLibre's own rotation is the right button, which
  // is the context menu here, or Control and the left, which macOS also
  // reads as a right-click; so neither is on. Option and the left button
  // turn it instead, a degree for each pixel or so across and, in 3-D,
  // tilt it for each pixel down. preventDefault on the press keeps the
  // map from panning under the same drag.
  map.on('mousedown', function (e) {
    var ev = e.originalEvent;
    if (!ev.altKey || ev.button !== 0 || dragging) return;
    e.preventDefault();
    var x0 = ev.clientX, y0 = ev.clientY, bearing0 = map.getBearing(), pitch0 = map.getPitch();
    map.getCanvas().style.cursor = 'grabbing';
    function onMove(m) {
      map.setBearing(bearing0 + (m.clientX - x0) * 0.8);
      if (map.getTerrain()) map.setPitch(Math.max(0, Math.min(80, pitch0 - (m.clientY - y0) * 0.5)));
    }
    function onUp() {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      map.getCanvas().style.cursor = '';
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  // Two fingers twisting on a trackpad, which WebKit reports as gesture
  // events beside the ctrl-wheel events MapLibre already reads as a
  // pinch. Not prevented, so the pinch keeps working; and a dead zone of
  // a few degrees, so a pinch that twists a little does not turn the map.
  var gestureBearing = null;
  var GESTURE_DEAD_ZONE = 8;
  document.addEventListener('gesturestart', function () { gestureBearing = map.getBearing(); });
  document.addEventListener('gesturechange', function (e) {
    if (gestureBearing === null || Math.abs(e.rotation) < GESTURE_DEAD_ZONE) return;
    map.setBearing(gestureBearing - (e.rotation - Math.sign(e.rotation) * GESTURE_DEAD_ZONE));
  });
  document.addEventListener('gestureend', function () { gestureBearing = null; });

  // Which way the map faces, for the compass, once a frame at most.
  var bearingFrame = null;
  map.on('rotate', function () {
    if (bearingFrame) return;
    bearingFrame = requestAnimationFrame(function () {
      bearingFrame = null;
      post({ type: 'bearing', bearing: map.getBearing() });
    });
  });

  // A fix of the track being edited moves; the edited track's line grows
  // a fix where it was grabbed and drags that, as a route's line does.
  map.on('mousedown', 'track-point', function (e) {
    if (dragging) return;
    var feature = e.features && e.features[0];
    if (!feature) return;
    beginDrag(e, 'track-point', feature.properties.id, feature.properties.seq);
  });

  map.on('mousedown', 'track-line', function (e) {
    if (dragging || !editingTrack) return;
    var feature = e.features && e.features[0];
    if (!feature || feature.properties.id !== editingTrack) return;
    // A press on a fix lands on its handle first; that one drags the fix.
    if (map.queryRenderedFeatures(e.point, { layers: ['track-point'] }).length) return;
    beginDrag(e, 'track-line', feature.properties.id, null);
  });

  // Keys the app cares about, forwarded because the web view is first
  // responder while the mouse is over the map, so SwiftUI never sees them.
  document.addEventListener('keydown', function (e) {
    var key = null;
    if (e.key === 'Backspace' || e.key === 'Delete') key = 'delete';
    else if (e.key === 'Escape') key = 'escape';
    if (!key) return;
    e.preventDefault();
    post({ type: 'key', key: key });
  });

  map.on('load', function () {
    // 'load' rather than 'idle' for readiness: the style has parsed and its
    // sources exist, which is exactly the condition setOverlay needs. Waiting
    // for 'idle' would also wait on tiles arriving over the network, and an
    // imported route should draw before the basemap under it finishes.
    post({ type: 'ready' });
  });

  // Where the map is looking, after each move settles, so Swift can fetch
  // the routing tiles under it before a drag asks for them. Debounced:
  // a fling settles through many moveend-sized steps.
  var viewTimer = null;
  function reportView() {
    var b = map.getBounds();
    post({ type: 'view', west: b.getWest(), south: b.getSouth(), east: b.getEast(), north: b.getNorth(),
           zoom: map.getZoom() });
  }
  map.on('moveend', function () {
    if (viewTimer) clearTimeout(viewTimer);
    viewTimer = setTimeout(reportView, 300);
  });
  map.on('load', reportView);

  // When the map next settles after an overlay push, for the render cost
  // of a long route: setData returns before the source is re-tiled and
  // drawn, and that work is on this thread too. The two data events split
  // it: 'content' when the worker has parsed and indexed the new data,
  // then the first tile of the source built from it.
  var overlayAppliedAt = null;
  var overlayContentAt = null;

  map.on('sourcedata', function (e) {
    if (!window.__SWIFTCAMP_TIMING__ || overlayAppliedAt === null || e.sourceId !== 'sc-route-lines') return;
    if (e.sourceDataType === 'content' && overlayContentAt === null) {
      overlayContentAt = performance.now();
      console.log('timing overlay.worker ' + (overlayContentAt - overlayAppliedAt).toFixed(0) + ' ms to content');
    } else if (e.tile && overlayContentAt !== null) {
      console.log('timing overlay.tile ' + (performance.now() - overlayContentAt).toFixed(0) + ' ms after content');
      overlayContentAt = null;
      // The frame that actually shows the new line. 'idle' comes about
      // 300 ms later whatever the line, which is the label crossfade
      // settling, not drawing.
      map.once('render', function () {
        if (overlayAppliedAt !== null) {
          console.log('timing overlay.frame ' + (performance.now() - overlayAppliedAt).toFixed(0) + ' ms to the frame that draws it');
        }
      });
    }
  });

  map.on('idle', function () {
    if (overlayAppliedAt !== null) {
      console.log('timing overlay.render ' + (performance.now() - overlayAppliedAt).toFixed(0) + ' ms to idle');
      overlayAppliedAt = null;
      overlayContentAt = null;
    }
    // Reported once: a non-zero feature count here proves the range requests
    // reached real data, and repeating it on every idle would bury the log.
    if (!map.__reported) {
      map.__reported = true;
      var features = map.queryRenderedFeatures();
      console.log('map idle, ' + map.getStyle().layers.length + ' layers, ' +
                  features.length + ' rendered features');
    }

    // The idle message itself fires EVERY time, so the snapshot harness
    // photographs the settled map rather than the first thing it drew.
    // Overlay data arrives after the basemap and on its own schedule, so a
    // one-shot snapshot caught the map before the route was on it and
    // reported an empty map as if the overlay had failed.
    post({ type: 'idle' });
  });

  map.on('error', function (e) { console.error('map error: ' + (e && e.error ? e.error.message : e)); });
})();
</script>
</body>
</html>
